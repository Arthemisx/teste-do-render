services:
  - type: web
    name: dona-memoria-api
    runtime: python
    plan: free
    rootDir: render-api
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --chdir /opt/render/project/src/render-api
    envVars:
      - key: API_SECRET
        value: dona-memoria-api-key-2026
      - key: DATABASE_URL
        fromDatabase:
          name: dona-memoria-db
          property: connectionString

databases:
  - name: dona-memoria-db
    plan: free
